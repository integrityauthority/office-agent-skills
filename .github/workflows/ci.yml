# One check, the same one a maintainer runs locally: can every skill here
# actually be published? A skill that fails this would be rejected by the
# attachment store halfway through an upload, or would install with
# instructions pointing at a file that never arrived.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_skills.py
      # The plugins ship a copy of each skill's files, because `hermes plugins
      # install` takes one directory and nothing outside it. The copy is a
      # derived artefact; this fails the build if it stops matching.
      - run: python tools/sync_plugins.py --check
