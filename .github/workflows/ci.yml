# Two jobs. "skills" is the check a maintainer runs before publishing: can
# every skill be published, do the plugin copies match, and is nothing
# internal about to become public. "tests" runs the test suite.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so a pull request's own commits can be checked.
          fetch-depth: 0
          # The pull request's own head, not the merge commit GitHub makes for
          # it: that commit's message ("Merge <sha> into <sha>") would be read
          # as two keys by the public-safety check below.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_skills.py
      # The plugins ship a copy of each skill's files, because `hermes plugins
      # install` takes one directory and nothing outside it. The copy is a
      # derived artefact; this fails the build if it stops matching.
      - run: python tools/sync_plugins.py --check
      # This repository is public. Internal hostnames, model deployments, keys
      # and work e-mail addresses must not reach it, in files or in commit
      # metadata; once fetched they cannot be taken back.
      - name: public-safety check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/check_public.py --commits "origin/$BASE_REF..HEAD"
          else
            python tools/check_public.py
          fi

  tests:
    # Every test builds its own PDFs, .msg and .eml files and runs a fake OCR
    # server, so nothing here touches a real document, mailbox or model.
    # Linux on purpose: file-reader and the shared PDF module must not depend
    # on Windows. (office-live needs Windows and Office; it is checked
    # statically in tests/test_plugins.py.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q
