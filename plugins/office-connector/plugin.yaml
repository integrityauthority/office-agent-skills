manifest_version: 2
name: office-connector
version: 1.4.0
description: >-
  Let Hermes work in Word, Excel, PowerPoint and classic Outlook. Drives the
  documents you have open, and writes a new report or letter in a window it
  opens for you rather than as a file in the background, so you watch it take
  shape. Word changes to your own documents arrive as tracked revisions you
  can accept or reject. In Outlook it searches mail, calendar
  and contacts and composes messages and meetings, then opens them for you —
  it never sends or saves; you press Send. Windows for now.
author: Integritas Hatosag
kind: standalone
platforms: [windows]

provides_tools:
  - office_status
  - office_exec
  - office_reset

# pywin32 ships inside the Hermes virtual environment already, so on a normal
# installation this resolves to a no-op. It is declared because the plugin is
# unusable without it and a missing dependency should fail at install time
# rather than on the first tool call.
python_dependencies:
  - pywin32
  # The plugin runs in its own environment, so office_exec could not read or
  # write a CLOSED workbook without this: the agent hit "No module named
  # 'openpyxl'" mid-task and fell back to writing its own scripts elsewhere.
  - openpyxl
