manifest_version: 2
name: file-connector
version: 1.4.1
description: >-
  Let Hermes read files from disk in one call: PDF (scanned pages through the
  organisation's OCR model), Outlook .msg and .eml e-mails with their
  attachments, Word, Excel, PowerPoint, HTML and text. Reads an attachment in
  place, saves attachments to a folder, renders PDF pages for a vision model.
  Read-only; a page with a text layer never leaves the machine.
author: Integritas Hatosag
kind: standalone

provides_tools:
  - file_read
  - file_find
  - file_attachments
  - file_render

# All permissive licences: pypdfium2 (Apache-2.0/BSD-3), pdfminer.six (MIT),
# pdfplumber (MIT, tables), olefile (BSD-2), openpyxl (MIT), pillow (HPND),
# pywinrt (MIT). Word, PowerPoint, .eml, HTML and text are read with the
# standard library.
python_dependencies:
  - pypdfium2
  - pdfminer.six
  - pdfplumber
  - olefile
  - openpyxl
  - pillow
  # Windows OCR on this machine (pywinrt, MIT); Windows only.
  - winrt-runtime>=3,<5; sys_platform == "win32"
  - winrt-Windows.Media.Ocr; sys_platform == "win32"
  - winrt-Windows.Graphics.Imaging; sys_platform == "win32"
  - winrt-Windows.Storage.Streams; sys_platform == "win32"
  - winrt-Windows.Globalization; sys_platform == "win32"
  - winrt-Windows.Foundation; sys_platform == "win32"

# OCR, shared with the other plugins in this repository (see the README,
# "Configuration"). All optional: Windows OCR needs none of them.
optional_env:
  - OCR_LOCAL
  - OCR_LOCAL_LANGUAGE
  - OCR_URL
  - OCR_MODEL
  - OCR_API_KEY
  - OCR_CLOUD_URL
  - OCR_CLOUD_MODEL
  - OCR_CLOUD_API_KEY
  - OCR_CLOUD_API_KEY_ENV
